version: "3.9"

services:
  bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: whatsapp-bridge
    restart: unless-stopped
    networks:
      - whatsapp-bot-network
    volumes:
      # Bridge session database and media files
      - bridge-store:/app/store
      # Shared messages database (bridge writes, bot reads)
      - shared-store:/shared/store
    environment:
      - WHATSAPP_LOG_LEVEL=${WHATSAPP_LOG_LEVEL:-INFO}
      - WHATSAPP_RESET_SESSION=${WHATSAPP_RESET_SESSION:-false}
      - WHATSAPP_RESET_MESSAGES=${WHATSAPP_RESET_MESSAGES:-false}
      - SHARED_STORE_PATH=/shared/store
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://bridge:8080/api/send"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    ports:
      - "8080:8080"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: whatsapp-bot
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - whatsapp-bot-network
    volumes:
      - bot-store:/app/store
      - shared-store:/shared/store
    environment:
      - BRIDGE_URL=http://bridge:8080

volumes:
  bridge-store:
  shared-store:
  bot-store:

networks:
  whatsapp-bot-network:
    driver: bridge